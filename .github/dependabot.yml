# Everything is grouped into a single weekly PR per ecosystem. Ungrouped
# Dependabot produces enough noise that people stop reading it, which defeats
# the point.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch]
    # Majors arrive as individual PRs — they need reading.
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    # release.yml is generated by dist, which pins the actions it emits — v6 of
    # actions/checkout at the version in dist-workspace.toml. Dependabot bumping
    # them makes the generated file disagree with its generator, so both
    # `dist generate --check` jobs fail and the PR cannot go green. The pins in
    # there are dist's to move: they change when cargo-dist-version does.
    exclude-paths:
      - .github/workflows/release.yml
