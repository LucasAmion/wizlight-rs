name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. A new push cancels the previous run, except on main where we
# want the history of results to stay intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail fast in CI rather than spending minutes on a build that will be
  # rejected by clippy anyway.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --all-features --workspace
      # Doc-tests are part of the contract: every public item is documented and
      # its examples must compile.
      - run: cargo test --doc --all-features

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      # cargo-hack reads rust-version from Cargo.toml, so the MSRV lives in one
      # place. This is the approach the Cargo book recommends.
      # https://doc.rust-lang.org/cargo/guide/continuous-integration.html#verifying-rust-version
      #
      # --each-feature checks every feature configuration rather than only the
      # default one, so `--no-default-features` — how library consumers depend
      # on the crate — is covered too.
      - run: cargo hack check --rust-version --each-feature --workspace --all-targets --ignore-private

  # Packaging problems (missing metadata, files excluded from the tarball,
  # unpublishable path deps) only surface at `cargo publish` time otherwise —
  # which is the worst moment to find them.
  package:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --all-features

  # release.yml is generated from dist-workspace.toml, not hand-written. Editing
  # the config without regenerating would silently keep shipping the previous
  # workflow, so the two are checked against each other on every run.
  #
  # The version below must match `cargo-dist-version` in dist-workspace.toml.
  # A mismatch is caught here rather than silently reformatting the workflow:
  # a different dist generates a different file, so --check fails.
  dist:
    name: dist workflow is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dist
        # bash for pipefail, so a failed curl is not swallowed by sh
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - run: dist generate --check

  deny:
    name: licences + advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
