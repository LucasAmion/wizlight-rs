# Publish the crate to crates.io.
#
# Called by release.yml, which is generated by dist and has no crates.io
# publisher of its own. Not triggered directly: it must run as part of a release
# so that it inherits the tag-vs-version check and the build.
#
# Trusted Publishing (OIDC) mints a short-lived, scoped token and revokes it in
# the post step, so no CARGO_REGISTRY_TOKEN is stored in repo secrets. The
# trusted publisher on crates.io is registered against `release.yml`, not this
# file, and that is correct: crates.io matches the `workflow_ref` claim, which
# names the workflow that started the run, not the reusable one containing the
# job.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crates:
    name: publish to crates.io
    runs-on: ubuntu-latest
    # Gates the publish behind a required reviewer, and is half of the trusted
    # publisher's identity — the OIDC token carries the environment of the job
    # that requested it, so this cannot move to the calling workflow.
    environment: release
    permissions:
      id-token: write   # required to mint the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --all-features --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
