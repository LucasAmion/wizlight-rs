name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Never publish something that does not build. The tag is not a promise.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --workspace
      - run: cargo publish --dry-run --all-features

  # Guard against the classic mistake: tagging v0.2.0 while Cargo.toml still
  # says 0.1.0, then publishing the wrong version.
  check-version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag to package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(cargo metadata --no-deps --format-version 1 \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "tag=$tag  Cargo.toml=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $pkg"
            exit 1
          fi

  publish:
    name: publish to crates.io
    needs: [verify, check-version]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # required to mint the OIDC token
      contents: write   # required to create the GitHub Release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # Mints a short-lived, scoped token over OIDC and revokes it in the post
      # step, so no long-lived CARGO_REGISTRY_TOKEN has to live in repo secrets.
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # A hyphen in the tag means a prerelease (v0.1.0-alpha.1). `gh` does not
      # infer this — without the flag an alpha is published as the repository's
      # "Latest release" and displaces the last stable one on the front page.
      - name: Create GitHub Release
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) pre=--prerelease ;;
            *)   pre= ;;
          esac
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag $pre
        env:
          GH_TOKEN: ${{ github.token }}
