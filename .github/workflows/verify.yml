# Test and packaging gate for a release.
#
# Called by release.yml, which is generated by dist. dist checks that the tag
# matches a package version, but it never runs the test suite — without this, a
# tag on a commit CI has not seen would build and publish regardless.
#
# `cargo publish --dry-run` is the other half: packaging faults, such as an
# `exclude` that drops a file the build needs, otherwise surface only during the
# real publish, by which point the GitHub Release is public and the tag is spent.
#
# dist calls this with no inputs and no `needs`, so it runs alongside `plan`
# rather than after it, and every build job waits on it.
name: Verify

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: test and package
    # release.yml also triggers on pull_request, where ci.yml has already run
    # both of these — on three platforms, in the case of the tests.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --all-features --workspace --locked

      - run: cargo publish --dry-run --all-features --locked
