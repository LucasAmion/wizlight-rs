[package]
name = "wizlight"
# Alphas until the M1 surface is complete. Publishing them keeps the release
# workflow, crates.io trusted publishing and the docs.rs build exercised, none
# of which can be set up or tested before the crate exists.
version = "0.1.0-alpha.2"
edition = "2024"
# Floor is set by clap 4.6 and by edition 2024; both need 1.85.
rust-version = "1.85"
description = "Async client for Philips WiZ smart bulbs over the local UDP protocol, plus the wizlight CLI"
authors = ["Lucas Amion"]
license = "MIT"
readme = "README.md"
# Repository infrastructure is meaningless to someone vendoring the crate. The
# test suite stays in: it is small, and the mock bulb it drives is the only
# executable description of the protocol we have.
exclude = [".github/", ".gitignore", "deny.toml", "dist-workspace.toml"]
repository = "https://github.com/LucasAmion/wizlight-rs"
homepage = "https://github.com/LucasAmion/wizlight-rs"
documentation = "https://docs.rs/wizlight"
keywords = ["wiz", "philips", "smart-home", "iot", "led"]
categories = [
    "network-programming",
    "hardware-support",
    "command-line-utilities",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["cli"]
# The CLI is a default feature so that `cargo install wizlight` just works.
# Library consumers should depend on this crate with `default-features = false`.
cli = [
    "dep:clap",
    "dep:anyhow",
    "dep:tracing",
    "dep:tracing-subscriber",
    "tokio/rt-multi-thread",
    "tokio/macros",
]

[[bin]]
name = "wizlight"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# Only for the `Stream` impl on discovery; the full `futures` crate is not
# needed to produce one.
futures-core = "0.3.31"
serde = { version = "1.0.229", features = ["derive"] }
# Deliberately *not* `preserve_order`. It would keep `Request`'s params in
# declaration order on the wire, but cargo feature unification would then
# impose an IndexMap-backed `serde_json::Map` on every other crate in a
# consumer's build. Measured on ESP25_SHRGB_01 fw 1.38.0: key order makes no
# difference — `{"r":255,"g":80,"b":0,"dimming":40}` and the same object sorted
# alphabetically are both accepted and produce identical state. So the wire
# tests compare parsed JSON rather than bytes.
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = [
    "net",
    "rt",
    "sync",
    "time",
] }

# cli only
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
# The library is not instrumented; this is the CLI's own logging, so that
# `-v` has something to show and the subscriber below is not dead weight.
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
], optional = true }

[dev-dependencies]
futures-util = { version = "0.3.31", default-features = false }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
