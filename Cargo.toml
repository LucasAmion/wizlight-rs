[package]
name = "wizlight"
# Alphas until the M1 surface is complete. Publishing them keeps the release
# workflow, crates.io trusted publishing and the docs.rs build exercised, none
# of which can be set up or tested before the crate exists.
version = "0.1.0-alpha.1"
edition = "2024"
# Floor is set by clap 4.6 and by edition 2024; both need 1.85.
rust-version = "1.85"
description = "Async client for Philips WiZ smart bulbs over the local UDP protocol, plus the wizlight CLI"
authors = ["Lucas Amion"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/LucasAmion/wizlight-rs"
homepage = "https://github.com/LucasAmion/wizlight-rs"
documentation = "https://docs.rs/wizlight"
keywords = ["wiz", "philips", "smart-home", "iot", "led"]
categories = [
    "network-programming",
    "hardware-support",
    "command-line-utilities",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["cli"]
# The CLI is a default feature so that `cargo install wizlight` just works.
# Library consumers should depend on this crate with `default-features = false`.
cli = [
    "dep:clap",
    "dep:anyhow",
    "dep:tracing-subscriber",
    "tokio/rt-multi-thread",
    "tokio/macros",
]

[[bin]]
name = "wizlight"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# Only for the `Stream` impl on discovery; the full `futures` crate is not
# needed to produce one.
futures-core = "0.3.31"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = [
    "net",
    "rt",
    "sync",
    "time",
] }

# cli only
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
], optional = true }

[dev-dependencies]
futures-util = { version = "0.3.31", default-features = false }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }
